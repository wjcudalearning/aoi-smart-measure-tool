name: AOI System CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'aoi_system/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'aoi_system/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'

jobs:
  lint-and-typecheck:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install ruff mypy pydantic pytest

      - name: Check code formatting and linter (Ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Static type check (Mypy)
        run: |
          uv run mypy aoi_system/ --ignore-missing-imports

  unit-and-algorithm-tests:
    name: Unit Tests & TDD Verification (${{ matrix.os }})
    needs: lint-and-typecheck
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          uv venv
          uv pip install -e ".[test]" || uv pip install pytest pytest-cov numpy opencv-python pydantic

      - name: Run Pytest with Coverage
        run: |
          uv run pytest tests/ \
            -v \
            --cov=aoi_system \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-report
          path: coverage.xml
