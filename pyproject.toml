[project]
name = "aoi-system"
version = "0.1.0"
description = "Modern GPU-Accelerated Industrial AOI Measurement & Judgement System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0.80",
    "pydantic>=2.7.0",
    "pyside6>=6.7.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["aoi_system"]

